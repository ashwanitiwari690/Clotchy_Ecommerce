<div class="stat-card card h-100">
  <div class="card-body d-flex align-items-start justify-content-between">
    <div>
      <div class="stat-card-title text-body-secondary small mb-1">{{ title }}</div>
      <div class="stat-card-value fs-4 fw-semibold">{{ value }}</div>
      @if (delta) {
        <div class="small mt-1" [class.text-success]="delta.direction === 'up'" [class.text-danger]="delta.direction === 'down'">
          <svg cIcon [name]="delta.direction === 'up' ? 'cilArrowTop' : 'cilArrowBottom'" size="sm"></svg>
          {{ delta.value }}% vs last period
        </div>
      }
    </div>
    <div class="stat-card-icon" [ngClass]="'bg-' + color + '-subtle text-' + color">
      <svg cIcon [name]="icon" size="xl"></svg>
    </div>
  </div>
</div>
