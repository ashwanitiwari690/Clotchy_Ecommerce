<app-page-header title="Orders" [breadcrumb]="[{ label: 'Sales' }, { label: 'Orders' }]" />

<div class="card">
  <div class="card-body border-bottom">
    <div class="row g-2">
      <div class="col-md-6">
        <app-global-search (search)="onSearch($event)"></app-global-search>
      </div>
      <div class="col-md-6">
        <select class="form-control" [ngModel]="statusFilter()" (ngModelChange)="onStatusChange($event)">
          <option value="">All Orders</option>
          <option value="pending">Pending</option>
          <option value="processing">Processing</option>
          <option value="shipped">Shipped</option>
          <option value="delivered">Delivered</option>
          <option value="cancelled">Cancelled / Returned</option>
        </select>
      </div>
    </div>
  </div>
  <div class="card-body p-0">
    <table class="table table-striped align-middle mb-0">
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Customer</th>
          <th>Date</th>
          <th class="text-end">Items</th>
          <th class="text-end">Total</th>
          <th>Payment</th>
          <th>Status</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (o of paged; track o.id) {
          <tr>
            <td><a [routerLink]="['/orders', o.id]" class="fw-medium">{{ o.id }}</a></td>
            <td>{{ o.customerName }}</td>
            <td class="text-body-secondary small">{{ o.date | appDate }}</td>
            <td class="text-end">{{ o.items.length }}</td>
            <td class="text-end">{{ formatCurrency(o.total) }}</td>
            <td><app-status-badge [status]="o.paymentStatus" /></td>
            <td><app-status-badge [status]="o.status" /></td>
            <td class="text-end"><a class="btn btn-sm btn-outline-secondary" [routerLink]="['/orders', o.id]">View</a></td>
          </tr>
        } @empty {
          <tr><td colspan="8"><app-empty-state title="No orders found" message="Try a different search or filter." /></td></tr>
        }
      </tbody>
    </table>
  </div>
  <div class="card-body d-flex justify-content-end">
    <app-pagination [totalItems]="filtered.length" [pageSize]="pageSize" [currentPage]="currentPage()" (pageChange)="onPageChange($event)" />
  </div>
</div>
