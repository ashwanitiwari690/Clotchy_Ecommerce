<app-page-header title="Product Reviews" [breadcrumb]="[{ label: 'Catalog' }, { label: 'Product Reviews' }]" />

<div class="card">
  <div class="card-body border-bottom d-flex flex-wrap align-items-center gap-2">
    <div class="btn-group btn-group-sm">
      <button type="button" class="btn btn-outline-secondary" [class.active]="activeFilter() === 'all'" (click)="setFilter('all')">All ({{ counts.all }})</button>
      <button type="button" class="btn btn-outline-secondary" [class.active]="activeFilter() === 'pending'" (click)="setFilter('pending')">Pending ({{ counts.pending }})</button>
      <button type="button" class="btn btn-outline-secondary" [class.active]="activeFilter() === 'approved'" (click)="setFilter('approved')">Approved ({{ counts.approved }})</button>
      <button type="button" class="btn btn-outline-secondary" [class.active]="activeFilter() === 'rejected'" (click)="setFilter('rejected')">Rejected ({{ counts.rejected }})</button>
    </div>
  </div>
  <app-global-search (search)="onSearch($event)"></app-global-search>
  <div class="card-body p-0">
    <table class="table table-striped align-middle mb-0">
      <thead>
        <tr>
          <th>Customer</th>
          <th>Product</th>
          <th>Rating</th>
          <th>Review</th>
          <th>Date</th>
          <th>Status</th>
          <th class="text-end">Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (r of reviews; track r.id) {
          <tr>
            <td class="fw-medium">{{ r.customerName }}</td>
            <td>{{ r.productName }}</td>
            <td>
              @for (s of stars; track s) {
                <span [class]="s <= r.rating ? 'text-warning' : 'text-body-secondary'">★</span>
              }
            </td>
            <td class="text-truncate d-inline-block" style="max-width: 260px;" [title]="r.comment">{{ r.comment }}</td>
            <td class="text-body-secondary small">{{ r.date | appDate }}</td>
            <td><app-status-badge [status]="r.status" /></td>
            <td class="text-end">
              <div class="btn-group btn-group-sm">
                @if (r.status !== 'approved') {
                  <button class="btn btn-outline-success" (click)="approve(r)">Approve</button>
                }
                @if (r.status !== 'rejected') {
                  <button class="btn btn-outline-warning" (click)="reject(r)">Reject</button>
                }
                <button class="btn btn-outline-danger" (click)="remove(r)">Delete</button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr><td colspan="7"><app-empty-state title="No reviews found" message="Try a different search or filter." /></td></tr>
        }
      </tbody>
    </table>
  </div>
</div>
