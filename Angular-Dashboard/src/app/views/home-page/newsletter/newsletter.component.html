<app-page-header title="Newsletter Section" [breadcrumb]="[{ label: 'Home Page Management', url: '/home-page' }, { label: 'Newsletter' }]" />

<div class="card" style="max-width: 720px;">
  <div class="card-header fw-semibold">Newsletter / Join Community</div>
  <div class="card-body">
    <form [formGroup]="form" class="row g-3">
      <div class="col-12">
        <label class="form-label">Section Title</label>
        <input type="text" class="form-control" formControlName="title" placeholder="Join the Clotchy family!" />
      </div>
      <div class="col-12">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="2" formControlName="description"></textarea>
      </div>
      <div class="col-md-6">
        <label class="form-label">Button Text</label>
        <input type="text" class="form-control" formControlName="buttonText" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Placeholder Text</label>
        <input type="text" class="form-control" formControlName="placeholderText" />
      </div>
      <div class="col-md-6">
        <label class="form-label">Status</label>
        <select class="form-control" formControlName="status">
          <option value="active">Active</option>
          <option value="inactive">Inactive</option>
        </select>
      </div>
      <div class="col-12">
        <label class="form-label">Background Image</label>
        <app-image-uploader [multiple]="false" [images]="images()" (imagesChange)="images.set($event)" />
      </div>
    </form>
  </div>
  <div class="card-footer text-end">
    <button class="btn btn-primary" (click)="save()">Save Changes</button>
  </div>
</div>
