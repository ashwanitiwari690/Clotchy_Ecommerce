<app-page-header title="Order Report" [breadcrumb]="[{ label: 'Reports' }, { label: 'Order Report' }]" />

<c-row class="g-3">
  <c-col xs="12" xl="6">
    <c-card class="h-100">
      <c-card-header class="fw-semibold">Status Summary</c-card-header>
      <c-card-body class="p-0">
        <table class="table table-striped align-middle mb-0">
          <thead><tr><th>Status</th><th class="text-end">Orders</th><th class="text-end">Revenue</th></tr></thead>
          <tbody>
            @for (s of statusSummary; track s.status) {
              <tr>
                <td><app-status-badge [status]="s.status" /></td>
                <td class="text-end">{{ s.count }}</td>
                <td class="text-end">{{ formatCurrency(s.revenue) }}</td>
              </tr>
            }
          </tbody>
        </table>
      </c-card-body>
    </c-card>
  </c-col>
  <c-col xs="12" xl="6">
    <app-chart-card title="Orders by Status" [chart]="statusChart" [height]="280" />
  </c-col>
</c-row>

<c-card class="mt-3">
  <c-card-header class="fw-semibold">All Orders</c-card-header>
  <c-card-body class="p-0">
    <table class="table table-striped align-middle mb-0">
      <thead>
        <tr><th>Order ID</th><th>Customer</th><th>Date</th><th class="text-end">Total</th><th>Payment</th><th>Status</th></tr>
      </thead>
      <tbody>
        @for (o of orders; track o.id) {
          <tr>
            <td>{{ o.id }}</td>
            <td>{{ o.customerName }}</td>
            <td class="text-body-secondary small">{{ o.date }}</td>
            <td class="text-end">{{ formatCurrency(o.total) }}</td>
            <td><app-status-badge [status]="o.paymentStatus" /></td>
            <td><app-status-badge [status]="o.status" /></td>
          </tr>
        }
      </tbody>
    </table>
  </c-card-body>
</c-card>
