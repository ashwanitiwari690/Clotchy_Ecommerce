<app-page-header title="Sales Report" [breadcrumb]="[{ label: 'Reports' }, { label: 'Sales Report' }]" />

<c-row class="g-3">
  <c-col xs="12" sm="6" class="col-xl">
    <app-stat-card title="Revenue" [value]="formatCurrency(revenue)" icon="cilDollar" color="success" />
  </c-col>
  <c-col xs="12" sm="6" class="col-xl">
    <app-stat-card title="Orders" [value]="orderCount" icon="cilCart" color="primary" />
  </c-col>
  <c-col xs="12" sm="6" class="col-xl">
    <app-stat-card title="Avg. Order Value" [value]="formatCurrency(aov)" icon="cilChartPie" color="info" />
  </c-col>
  <c-col xs="12" sm="6" class="col-xl">
    <app-stat-card title="Refunds" [value]="formatCurrency(refunds)" icon="cilWarning" color="danger" />
  </c-col>
  <c-col xs="12" sm="6" class="col-xl">
    <app-stat-card title="Discounts Given" [value]="formatCurrency(discounts)" icon="cilBasket" color="warning" />
  </c-col>
</c-row>

<c-row class="g-3 mt-1">
  <c-col xs="12">
    <app-chart-card title="Revenue by Date" [chart]="revenueChart" [height]="280" />
  </c-col>
</c-row>

<c-card class="mt-3">
  <c-card-header class="fw-semibold">All Orders</c-card-header>
  <c-card-body class="p-0">
    <table class="table table-striped align-middle mb-0">
      <thead>
        <tr><th>Order ID</th><th>Customer</th><th>Date</th><th class="text-end">Total</th><th>Payment</th><th>Status</th></tr>
      </thead>
      <tbody>
        @for (o of orders; track o.id) {
          <tr>
            <td>{{ o.id }}</td>
            <td>{{ o.customerName }}</td>
            <td class="text-body-secondary small">{{ o.date }}</td>
            <td class="text-end">{{ formatCurrency(o.total) }}</td>
            <td><app-status-badge [status]="o.paymentStatus" /></td>
            <td><app-status-badge [status]="o.status" /></td>
          </tr>
        }
      </tbody>
    </table>
  </c-card-body>
</c-card>

<style>
  .col-xl { flex: 0 0 auto; width: 20%; }
  @media (max-width: 1200px) { .col-xl { width: 100%; } }
</style>
