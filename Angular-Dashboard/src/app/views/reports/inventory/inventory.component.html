<app-page-header title="Inventory Report" [breadcrumb]="[{ label: 'Reports' }, { label: 'Inventory Report' }]" />

@if (report(); as r) {
  <c-row class="g-3">
    <c-col xs="12" sm="6" xl="3">
      <app-stat-card title="Total SKUs" [value]="r.totalSkus" icon="cilStorage" color="dark" />
    </c-col>
    <c-col xs="12" sm="6" xl="3">
      <app-stat-card title="In Stock" [value]="r.inStockCount" icon="cilBasket" color="success" />
    </c-col>
    <c-col xs="12" sm="6" xl="3">
      <app-stat-card title="Low Stock" [value]="r.lowStockCount" icon="cilWarning" color="warning" />
    </c-col>
    <c-col xs="12" sm="6" xl="3">
      <app-stat-card title="Out of Stock" [value]="r.outOfStockCount" icon="cilWarning" color="danger" />
    </c-col>
  </c-row>

  <c-row class="g-3 mt-1">
    <c-col xs="12">
      @if (stockByCategoryChart(); as chart) {
        <app-chart-card title="Stock by Category" [chart]="chart" [height]="280" />
      }
    </c-col>
  </c-row>

  <c-card class="mt-3">
    <c-card-header class="fw-semibold">All Products</c-card-header>
    <c-card-body class="p-0">
      <table class="table table-striped align-middle mb-0">
        <thead><tr><th>Product</th><th>SKU</th><th>Category</th><th class="text-end">Stock</th><th class="text-end">Threshold</th><th>Status</th></tr></thead>
        <tbody>
          @for (p of r.products; track p.id) {
            <tr>
              <td><div class="d-flex align-items-center gap-2"><img [src]="p.thumbnail" class="rpt-thumb" [alt]="p.name" /><span class="text-truncate" style="max-width:180px;">{{ p.name }}</span></div></td>
              <td class="text-body-secondary">{{ p.sku }}</td>
              <td>{{ categoryName(p.categoryId) }}</td>
              <td class="text-end">{{ p.stock }}</td>
              <td class="text-end">{{ p.lowStockThreshold }}</td>
              <td><app-status-badge [status]="productStatus(p)" /></td>
            </tr>
          }
        </tbody>
      </table>
    </c-card-body>
  </c-card>
}

<style>
  .rpt-thumb { width: 32px; height: 32px; object-fit: cover; border-radius: 0.25rem; }
</style>
