<c-row class="g-3">
  <c-col xs="12" sm="6" xl="3">
    <app-stat-card title="Total Revenue" [value]="formatCurrency(kpi.totalRevenue)" icon="cilDollar" color="success" [delta]="{ value: 12.4, direction: 'up' }" />
  </c-col>
  <c-col xs="12" sm="6" xl="3">
    <app-stat-card title="Total Orders" [value]="kpi.totalOrders" icon="cilCart" color="primary" [delta]="{ value: 8.1, direction: 'up' }" />
  </c-col>
  <c-col xs="12" sm="6" xl="3">
    <app-stat-card title="Total Customers" [value]="kpi.totalCustomers" icon="cilPeople" color="info" [delta]="{ value: 4.6, direction: 'up' }" />
  </c-col>
  <c-col xs="12" sm="6" xl="3">
    <app-stat-card title="Total Products" [value]="kpi.totalProducts" icon="cilBasket" color="dark" />
  </c-col>
  <c-col xs="12" sm="6" xl="3">
    <app-stat-card title="Pending Orders" [value]="kpi.pendingOrders" icon="cilClock" color="warning" />
  </c-col>
  <c-col xs="12" sm="6" xl="3">
    <app-stat-card title="Low Stock Products" [value]="kpi.lowStockProducts.length" icon="cilWarning" color="danger" />
  </c-col>
  <c-col xs="12" sm="6" xl="3">
    <app-stat-card title="Open Support Tickets" [value]="kpi.openTickets" icon="cilHeadphones" color="info" />
  </c-col>
  <c-col xs="12" sm="6" xl="3">
    <app-stat-card title="Today's Sales" [value]="formatCurrency(kpi.todaysSales)" icon="cilChartPie" color="success" />
  </c-col>
</c-row>

<c-row class="g-3 mt-1">
  <c-col xs="12" xl="12">
    <app-chart-card
      title="Sales Overview"
      subtitle="Revenue and order volume trend"
      [chart]="salesChart"
      [height]="300"
      [periods]="salesPeriods"
      [activePeriod]="activePeriod"
      (periodChange)="setSalesPeriod($event)"
    />
  </c-col>
</c-row>

<c-row class="g-3 mt-1">
  <c-col xs="12" md="6">
    <app-chart-card title="Orders Overview" subtitle="Orders by current status" [chart]="orderStatusChart" [height]="260" />
  </c-col>
  <c-col xs="12" md="6">
    <app-chart-card title="Revenue Overview" subtitle="Revenue by category" [chart]="revenueByCategoryChart" [height]="260" />
  </c-col>
</c-row>
