<div class="bg-light min-vh-100 d-flex align-items-center">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-7 col-md-9 col-xl-6">
        <div class="card mx-4">
          <div class="card-body p-4">

            <form>
              <h1>Register</h1>
              <p class="text-secondary">Create your account</p>

              <!-- Username -->
              <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bi bi-person"></i>
                </span>
                <input type="text" class="form-control" placeholder="Username" autocomplete="name" />
              </div>

              <!-- Email -->
              <div class="input-group mb-3">
                <span class="input-group-text">@</span>
                <input type="email" class="form-control" placeholder="Email" autocomplete="email" />
              </div>

              <!-- Password -->
              <div class="input-group mb-3">
                <span class="input-group-text">
                  <i class="bi bi-lock"></i>
                </span>
                <input type="password" class="form-control" placeholder="Password" autocomplete="new-password" />
              </div>

              <!-- Repeat Password -->
              <div class="input-group mb-4">
                <span class="input-group-text">
                  <i class="bi bi-lock"></i>
                </span>
                <input type="password" class="form-control" placeholder="Repeat password" autocomplete="new-password" />
              </div>

              <!-- Submit -->
              <div class="d-grid">
                <button type="submit" class="btn btn-success">
                  Create Account
                </button>
              </div>
            </form>
            <div>Already have an account? Sign In</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
