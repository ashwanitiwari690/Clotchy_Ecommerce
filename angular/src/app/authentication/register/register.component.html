<section class="login-page container">
  <div class="page-title"><span>HOME / REGISTER</span><h1>REGISTER</h1></div>

  <div class="login-box">
    <label>Full Name</label>
    <input type="text" [value]="name()" placeholder="Enter your full name" (input)="onNameInput($event)">

    <label>Mobile Number</label>
    <div class="phone-field">
      <span class="prefix">+91</span>
      <input type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="10" [value]="phone()" placeholder="Enter 10-digit mobile number"
        (keydown)="onPhoneKeydown($event)" (input)="onPhoneInput($event)">
    </div>

    <label>Password</label>
    <div class="password-field">
      <input [type]="showPassword() ? 'text' : 'password'" [value]="password()" placeholder="Create a password" (input)="onPasswordInput($event)">
      <button type="button" class="otp-btn" (click)="showPassword.update(v => !v)">{{ showPassword() ? 'HIDE' : 'SHOW' }}</button>
    </div>

    <label>Confirm Password</label>
    <div class="password-field">
      <input [type]="showConfirmPassword() ? 'text' : 'password'" [value]="confirmPassword()" placeholder="Re-enter your password"
        (input)="onConfirmPasswordInput($event)" (keyup.enter)="register()">
      <button type="button" class="otp-btn" (click)="showConfirmPassword.update(v => !v)">{{ showConfirmPassword() ? 'HIDE' : 'SHOW' }}</button>
    </div>

    @if (error()) { <small class="error">{{ error() }}</small> }
    <button class="primary-btn" [disabled]="isSubmitting()" (click)="register()">{{ isSubmitting() ? 'PLEASE WAIT…' : 'REGISTER' }}</button>

    <p class="alt-link">Already have an account? <a routerLink="/login">Login</a></p>
  </div>
</section>
